      /setup_chat status — к какому коллективу привязан этот чат
      /setup_chat off — отвязать этот чат
  menu:
    info: |-
      <b>О боте</b>
      Это бот AlmaEventFlow. Он присылает уведомления о мероприятиях, даёт
