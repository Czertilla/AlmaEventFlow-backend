        <b>Привязка аккаунта</b>
        1. Войдите на сайт или зарегистрируйтесь.
        2. Откройте «Профиль» и нажмите «Подключить Telegram».
        3. Перейдите по ссылке, которую вам покажут, — она откроет этот чат, и всё готово.
        <blockquote expandable>Привязка нужна, чтобы я знал, в каких коллективах вы состоите: так я смогу присылать уведомления об их мероприятиях и принимать ваши отметки. Отвязать аккаунт можно в любой момент в /account.</blockquote>
