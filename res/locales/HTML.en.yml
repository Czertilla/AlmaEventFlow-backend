---
en:
  title: "%{ch} English"
  description: |-
    AlmaEventFlow bot — link your Telegram to your AEF account and get
    event notifications. Use /start to open the menu.
  help: |-
    <b>Help</b>

    /start — open the main menu
    /account — manage your linked AlmaEventFlow account
    /language — change the interface language
    /help — show this message
    /setup_chat — set this group chat as a collective's official chat
    (groups only, for collective principals)
  start:
    greeting: |-
      <b>Welcome to AlmaEventFlow!</b>
      Pick an action below.
  menu:
    info: |-
      <b>About</b>
      This is the AlmaEventFlow bot. Link your Telegram to your AEF account
      to receive event notifications here.
    main:
      title: <b>Main menu</b>
      items:
        account: "%{ch} My account"
        lang: "%{ch} Language"
        info: "%{ch} About"
    language:
      title: |-
        <b>Choose a language</b>
        <blockquote>Current: %{current_lang}</blockquote>
      items:
        sys: "%{ch} System"
  account:
    linked: |-
      %{ch} Your Telegram is linked to an AlmaEventFlow account.
    not_linked: |-
      %{ch} Your Telegram isn't linked yet.
      Open your profile on the AlmaEventFlow website and connect Telegram
      there — it will send you a link to open here.
    confirm_unlink: "%{ch} Unlink Telegram from your AlmaEventFlow account?"
    unlinked: "%{ch} Telegram unlinked."
    linked_success: "%{ch} Telegram linked to your AlmaEventFlow account!"
    link_invalid: "%{ch} This link is invalid. Request a new one on the website."
    link_expired: "%{ch} This link has expired. Request a new one on the website."
    notifications_on: "%{ch} Telegram notifications turned on."
    notifications_off: "%{ch} Telegram notifications turned off."
    notifications_error: "%{ch} Couldn't change that setting. Try again later."
  setup_chat:
    not_linked: |-
      %{ch} First link your Telegram to your AlmaEventFlow account in a
      private message with the bot: /account
    not_admin: |-
      %{ch} Make the bot an admin in this chat first, then run this
      command again.
    no_collective: "%{ch} You don't lead any collective."
    ambiguous: "%{ch} You lead more than one collective. Pick one below:"
    error: "%{ch} Couldn't check your collectives. Try again later."
    invalid_id: "%{ch} Invalid collective_id."
    success: "%{ch} Done! This chat is now the official chat for that collective."
    disabled: "%{ch} This chat is no longer bound to any collective."
    not_bound: |-
      %{ch} This chat wasn't bound to a collective you lead.
  error:
    username: "%{ch} For the bot to work best, set a @username in your Telegram settings."
    user_not_found: "User not found."
    wip: "%{ch} Work in progress."
  button:
    back: "%{ch} Back"
    cancel: "%{ch} Cancel"
    confirm: "%{ch} Confirm"
    add: "%{ch} Add"
    delete: "%{ch} Delete"
    unlink: "%{ch} Unlink"
    notifications: "%{ch} Telegram notifications"
  _commands:
    default:
      start: Open the main menu
      help: Show help
      language: Change language
      account: Manage your linked account
      setup_chat: Set this chat as a collective's official chat
    superuser:
      admin: Admin panel
