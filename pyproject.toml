[project]
name = "alma-event-flow"
version = "0.5.0-beta"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiobotocore>=3.7.0",
    "aiogram>=3.31.0",
    "aiohttp>=3.14.1",
    "alembic>=1.18.4",
    "apscheduler>=3.11.2",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "beanie>=2.0.0",
    "colorama>=0.4.6",
    "fastapi>=0.137.1",
    "fastapi-filter[sqlalchemy]>=3.0.0",
    "faststream[kafka]>=0.7.1",
    "passlib>=1.7.4",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.1",
    "redis>=8.0.0",
    "ruff>=0.15.17",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
bot = [
    "aiocache>=0.12.3",
    "aiogram3-di>=2.0.0",
    "pyjwt>=2.13.0",
    "python-i18n[yaml]>=0.3.9",
]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "uvicorn>=0.37.0",
    "ruff>=0.15.17",
    "basedpyright>=1.40.1",
]
event = [
    "icalendar>=7.1.3",
]
geo = [
    "beanie>=2.0.0",
    "geoalchemy2[shapely]>=0.20.0",
]
mail = [
    "fastapi-mail>=1.6.4",
    "jinja2>=3.1.6",
]
notify = [
    "webpush>=1.0.3",
]
prod = [
    "gunicorn>=26.0.0",
]
proxy = [
    "aiohttp-socks>=0.12.0",
]
report = [
    "docxtpl>=0.20.2",
    "matplotlib>=3.11.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "treport>=0.0.6",
]
user = [
    "fastapi-users[oauth,sqlalchemy]>=15.0.5",
    "jinja2>=3.1.6",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC", "N"]
# Russian text: Cyrillic look-alikes of Latin letters (one-letter words, short words), emoji and en dash in bot texts
allowed-confusables = [
    "\u0430", # CYRILLIC SMALL LETTER A
    "\u0431", # CYRILLIC SMALL LETTER BE
    "\u0433", # CYRILLIC SMALL LETTER GHE
    "\u0435", # CYRILLIC SMALL LETTER IE
    "\u043e", # CYRILLIC SMALL LETTER O
    "\u0440", # CYRILLIC SMALL LETTER ER
    "\u0441", # CYRILLIC SMALL LETTER ES
    "\u0443", # CYRILLIC SMALL LETTER U
    "\u0410", # CYRILLIC CAPITAL LETTER A
    "\u0412", # CYRILLIC CAPITAL LETTER VE
    "\u0417", # CYRILLIC CAPITAL LETTER ZE
    "\u041d", # CYRILLIC CAPITAL LETTER EN
    "\u2013", # EN DASH
    "\u2139", # INFORMATION SOURCE
    "\u2795", # HEAVY PLUS SIGN
    "\u2796", # HEAVY MINUS SIGN
]

[tool.ruff.lint.per-file-ignores]
# env vars must be set before the project imports
"tests/conftest.py" = ["E402"]
# Alembic revisions are frozen history, their long lines are not rewrapped
"migrations/versions/**" = ["E501"]
# generated by scripts/generate_locales.py, long lines are locale text
"src/bot/enum/locales.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# DI markers evaluated by the framework per request, not shared mutable defaults
extend-immutable-calls = [
    "core.dto.pagination.PageParamDTO",
    "fastapi.Depends",
    "core.filter.depends.FilterDepends",
]

[tool.basedpyright]
typeCheckingMode = "strict"
# no py.typed and no stub package upstream: aiogram3_di, aiocache, i18n, aiokafka, aiobotocore, botocore, webpush, docxtpl, asyncpg
reportMissingTypeStubs = false
# the first matching root wins: keep a nested root above its parent
executionEnvironments = [
  { root = "src/bot/tg/api/router", reportUnusedCallResult = false },
  # untyped pytest fixtures, mocks and asyncpg results; tests reach into private helpers on purpose
  { root = "tests", reportUnknownArgumentType = false, reportUnknownMemberType = false, reportUnknownParameterType = false, reportUnknownVariableType = false, reportMissingParameterType = false, reportMissingTypeArgument = false, reportPrivateUsage = false },
  # geoalchemy2 adds op.create_geospatial_* to Alembic at import time
  { root = "migrations/versions/geo", reportAttributeAccessIssue = false, reportUnknownMemberType = false },
  # Alembic env hooks and the untyped geoalchemy2 / postgresql.ENUM column types
  { root = "migrations", reportUnknownArgumentType = false, reportUnknownMemberType = false, reportUnknownParameterType = false, reportMissingParameterType = false },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "load: Load / stress / performance tests.",
]
