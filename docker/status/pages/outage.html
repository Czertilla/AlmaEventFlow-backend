<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="30">
  <title>Сервер недоступен</title>
  <style>
    :root { --bg: #f7f7fb; --card: #fff; --text: #1a1a2e; --muted: #6b6b80; --accent: #6c63ff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12121c; --card: #1c1c2b; --text: #f2f2f8; --muted: #a0a0b8; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 420px; padding: 32px 24px; border-radius: 20px; background: var(--card); text-align: center; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08); }
    .icon { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px; background: var(--accent); color: #fff; font-size: 28px; line-height: 56px; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
    p:last-child { margin: 0; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">!</div>
    <h1>Сервер недоступен по техническим причинам</h1>
    <p>Мы уже знаем о проблеме. Обновите страницу через несколько минут.</p>
    <p>Если ошибка не исчезает, обратитесь в поддержку или к администрации. Страница обновится сама.</p>
  </main>
</body>
</html>
